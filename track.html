<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Crochet Order - Nepal Can Move</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f9f6f0; /* Soft warm tone suitable for a handmade crochet brand */
color: #4a3b32;
margin: 0;
padding: 40px 20px;
display: flex;
justify-content: center;
align-items: center;
min-height: 80vh;
}
.tracking-container {
background: #ffffff;
padding: 30px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.08);
max-width: 500px;
width: 100%;
text-align: center;
}
h2 {
margin-bottom: 10px;
color: #5c4033;
}
p {
font-size: 14px;
color: #776b62;
margin-bottom: 25px;
}
.form-group {
margin-bottom: 20px;
text-align: left;
}
label {
display: block;
font-weight: 600;
margin-bottom: 8px;
font-size: 13px;
}
input[type="text"] {
width: 100%;
padding: 12px;
border: 1px solid #dcd6d0;
border-radius: 6px;
font-size: 16px;
box-sizing: border-box;
outline: none;
transition: border-color 0.2s;
}
input[type="text"]:focus {
border-color: #a47551;
}
button {
background-color: #a47551;
color: white;
border: none;
padding: 12px 20px;
width: 100%;
border-radius: 6px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: background-color 0.2s;
}
button:hover {
background-color: #865d3d;
}
.ncm-note {
margin-top: 20px;
font-size: 12px;
color: #998f86;
}
</style>
</head>
<body>

<div class="tracking-container">
<h2>Track Your Crochet Package</h2>
<p>Enter your Nepal Can Move (NCM) tracking or waybill number below to check your delivery status.</p>

<form id="trackingForm" onsubmit="trackOrder(event)">
<div class="form-group">
<label for="trackingCode">NCM Tracking Number:</label>
<input type="text" id="trackingCode" placeholder="e.g., NCM-XXXXXX" required>
</div>
<button type="submit">Track with Nepal Can Move</button>
</form>

<div class="ncm-note">
Powered securely in partnership with Nepal Can Move logistics.
</div>
</div>

<script>
function trackOrder(event) {
event.preventDefault();
const trackingCode = document.getElementById('trackingCode').value.trim();

if (trackingCode) {
// Redirects user to the official Nepal Can Move tracking portal page
const ncmUrl = `https://portal.nepalcanmove.com/track/`;

// Open official tracking page in a new tab
window.open(ncmUrl, '_blank');
}
}
</script>

</body>
</html>
